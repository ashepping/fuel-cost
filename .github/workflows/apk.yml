name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode launcher image if valid
        run: |
          python3 - <<'PY'
          import base64, pathlib
          p = pathlib.Path('branding/ic_launcher.b64')
          out = pathlib.Path('app/src/main/res/drawable/ic_launcher_src.jpg')
          try:
              raw = ''.join(p.read_text().split())
              raw += '=' * ((4 - len(raw) % 4) % 4)
              data = base64.b64decode(raw, validate=False)
              if data[:3] in (b'\xff\xd8\xff', b'\x89PN'):
                  out.write_bytes(data)
                  print('wrote', out, out.stat().st_size)
              else:
                  print('skip invalid image bytes')
          except Exception as e:
              print('skip decode:', e)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/poehali-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: poehali-debug
          path: out/poehali-debug.apk
          if-no-files-found: error
