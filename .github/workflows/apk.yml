name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Optional launcher photo
        run: |
          python3 - <<'PY'
          import base64, pathlib
          out = pathlib.Path('app/src/main/res/drawable/ic_launcher_src.jpg')
          try:
              parts = sorted(pathlib.Path('branding').glob('ic_p*.txt'))
              raw = ''.join(''.join(p.read_text().split()) for p in parts)
              n = len(raw) % 4
              if n == 1:
                  raw = raw[:-1]
              elif n:
                  raw += '=' * (4 - n)
              data = base64.b64decode(raw, validate=False)
              if data[:2] == b'\xff\xd8':
                  out.write_bytes(data)
                  print('photo ok', len(data))
              else:
                  print('skip photo')
          except Exception as e:
              print('skip photo', e)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/poehali-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: poehali-debug
          path: out/poehali-debug.apk
          if-no-files-found: error
