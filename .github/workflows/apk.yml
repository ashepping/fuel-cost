name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode launcher image
        run: |
          python3 - <<'PY'
          import base64, pathlib
          raw = pathlib.Path("branding/ic_launcher.b64").read_text().strip()
          out = pathlib.Path("app/src/main/res/drawable/ic_launcher_src.jpg")
          out.write_bytes(base64.b64decode(raw))
          print("wrote", out, out.stat().st_size)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/poehali-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: poehali-debug
          path: out/poehali-debug.apk
          if-no-files-found: error
